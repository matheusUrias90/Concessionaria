<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - Concessionária</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

<div class="container login-container">

    <h1>🔐 Login</h1>

    <form action="/login" method="post" class="card-form login-form">

        <div th:if="${erro}" class="mensagem-erro">
            <p th:text="${erro}"></p>
        </div>

        <div class="campo">
            <label>Usuário</label>
            <input type="text" name="login" placeholder="Digite seu usuário">
        </div>

        <div class="campo">
            <label>Senha</label>
            <input type="password" name="senha" placeholder="Digite sua senha">
        </div>

        <button type="submit" class="btn-salvar">
            Entrar
        </button>

    </form>

</div>

</body>
</html>
