
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <body>

        <div th:fragment="menu">

            <!-- BOTÃO MOBILE -->
            <button type="button"
                    class="menu-mobile-botao"
                    onclick="alternarMenu()">
                ☰
            </button>

            <div class="menu-overlay"
                 onclick="alternarMenu()">
            </div>

            <aside class="menu-lateral">

                <!-- CABEÇALHO -->
                <div class="menu-cabecalho">
                    <h2>🚗 Urias Veiculos</h2>
                </div>

                <!-- USUÁRIO LOGADO -->
                <div class="menu-usuario"
                     th:if="${session.usuarioLogado != null}">

                    <button type="button" class="usuario-botao">

                        <span class="usuario-icone">👤</span>

                        <div class="usuario-info">

                            <strong th:text="${session.usuarioLogado.nome}"></strong>

                            <small th:text="${session.usuarioLogado.perfil}"></small>

                        </div>

                        <span class="seta">▼</span>

                    </button>

                    <div class="submenu-usuario">

                        <a th:href="@{/meu-perfil}">
                            👤 Meu Perfil
                        </a>

                        <a th:if="${session.usuarioLogado.perfil == 'DONO'}"
                           th:href="@{/configuracao}">
                            ⚙ Configuração da Empresa
                        </a>

                        <a th:if="${session.usuarioLogado.perfil == 'DONO'
                           or session.usuarioLogado.perfil == 'GERENTE'}"
                           th:href="@{/admin/solicitacoes-login}">
                            🔐 Solicitações de Login
                        </a>

                        <a th:href="@{/logout}">
                            🚪 Sair
                        </a>

                    </div>

                </div>

                <!-- NAVEGAÇÃO -->
                <nav class="menu-links"
                     th:if="${session.usuarioLogado != null}">

                    <!-- GERENCIAMENTO -->
                    <span class="menu-titulo">
                        GERENCIAMENTO
                    </span>

                    <!-- DASHBOARD ADMIN -->
                    <a th:if="${session.usuarioLogado.perfil == 'DONO'
                       or session.usuarioLogado.perfil == 'GERENTE'}"
                       th:href="@{/admin}"
                       class="menu-link"
                       th:classappend="${paginaAtiva == 'admin'} ? ' ativo'">

                        <span>🏠</span>
                        Dashboard

                    </a>

                    <!-- DASHBOARD VENDEDOR -->
                    <a th:if="${session.usuarioLogado.perfil == 'VENDEDOR'}"
                       th:href="@{/dashboard-vendedor}"
                       class="menu-link"
                       th:classappend="${paginaAtiva == 'dashboard'} ? ' ativo'">

                        <span>🏠</span>
                        Painel

                    </a>

                    <!-- VEÍCULOS -->
                    <a th:href="@{/veiculos}"
                       class="menu-link"
                       th:classappend="${paginaAtiva == 'veiculos'} ? ' ativo'">

                        <span>🚗</span>
                        Veículos

                    </a>

                    <!-- COMPRADORES -->
                    <a th:href="@{/compradores}"
                       class="menu-link"
                       th:classappend="${paginaAtiva == 'compradores'} ? ' ativo'">

                        <span>👥</span>
                        Compradores

                    </a>

                    <!-- NEGOCIAÇÕES -->
                    <a th:href="@{/negociacoes}"
                       class="menu-link"
                       th:classappend="${paginaAtiva == 'negociacoes'} ? ' ativo'">

                        <span>🤝</span>
                        Negociação

                    </a>

                    <!-- NOTIFICAÇÕES -->
                    <a th:href="@{/notificacoes}"
                       class="menu-link"
                       th:classappend="${paginaAtiva == 'notificacoes'} ? ' ativo'">

                        <span>🔔</span>
                        Notificações

                        <span class="badge-notificacao"
                              th:if="${notificacoesNaoLidas != null
                              and notificacoesNaoLidas > 0}"
                              th:text="${notificacoesNaoLidas}">
                            1
                        </span>

                    </a>

                    <!-- ADMINISTRAÇÃO: DONO E GERENTE -->
                    <div class="menu-grupo"
                         th:if="${session.usuarioLogado.perfil == 'DONO'
                         or session.usuarioLogado.perfil == 'GERENTE'}">

                        <span class="menu-titulo">
                            ADMINISTRAÇÃO
                        </span>

                        <a th:href="@{/usuarios}"
                           class="menu-link"
                           th:classappend="${paginaAtiva == 'usuarios'} ? ' ativo'">

                            <span>👤</span>
                            Usuários

                        </a>

                    </div>
                    <!-- FIM ADMINISTRAÇÃO -->


                    <!-- FINANCEIRO: DONO E GERENTE -->
                    <div class="menu-grupo"
                         th:if="${session.usuarioLogado.perfil == 'DONO'
                         or session.usuarioLogado.perfil == 'GERENTE'}">

                        <span class="menu-titulo">
                            FINANCEIRO
                        </span>

                        <a th:href="@{/admin/vendas}"
                           class="menu-link"
                           th:classappend="${paginaAtiva == 'vendas'} ? ' ativo'">

                            <span>💰</span>
                            Vendas

                        </a>

                        <a th:href="@{/repasses}"
                           class="menu-link"
                           th:classappend="${paginaAtiva == 'repasses'} ? ' ativo'">

                            <span>💸</span>
                            Repasses

                        </a>

                    </div>
                    <!-- FIM FINANCEIRO -->


                    <!-- RELATÓRIOS: TODOS OS PERFIS -->
                    <div class="menu-grupo">

                        <span class="menu-titulo">
                            RELATÓRIOS
                        </span>

                        <div class="menu-relatorios">

                            <button type="button"
                                    class="menu-link relatorios-botao"
                                    onclick="alternarRelatorios()">

                                <span>📊</span>
                                Relatórios
                                <span class="seta">▼</span>

                            </button>

                            <div class="submenu-relatorios">

                                <!-- VENDAS -->
                                <a th:href="@{/relatorios/vendas}"
                                   th:classappend="${paginaAtiva == 'relatorioVendas'} ? ' ativo'">

                                    💰 <span th:text="${session.usuarioLogado.perfil == 'VENDEDOR'
                                             ? 'Minhas Vendas' : 'Vendas'}"></span>

                                </a>

                                <!-- VENDEDORES -->
                                <a th:href="@{/relatorios/vendedores}"
                                   th:classappend="${paginaAtiva == 'relatorioVendedores'} ? ' ativo'">

                                    👔 <span th:text="${session.usuarioLogado.perfil == 'VENDEDOR'
                                             ? 'Meu Desempenho' : 'Vendedores'}"></span>

                                </a>

                                <!-- NEGOCIAÇÕES -->
                                <a th:href="@{/relatorios/negociacoes}"
                                   th:classappend="${paginaAtiva == 'relatorioNegociacoes'} ? ' ativo'">

                                    🤝 <span th:text="${session.usuarioLogado.perfil == 'VENDEDOR'
                                             ? 'Minhas Negociações' : 'Negociações'}"></span>

                                </a>


                                <!-- ESTOQUE: DONO E GERENTE -->
                                <a th:if="${session.usuarioLogado.perfil == 'DONO'
                                   or session.usuarioLogado.perfil == 'GERENTE'}"
                                   th:href="@{/relatorios/estoque}"
                                   th:classappend="${paginaAtiva == 'relatorioEstoque'} ? ' ativo'">
                                    🚗 Estoque
                                </a>

                                <!-- REPASSES: DONO E GERENTE -->
                                <a th:if="${session.usuarioLogado.perfil == 'DONO'
                                   or session.usuarioLogado.perfil == 'GERENTE'}"
                                   th:href="@{/relatorios/repasses}"
                                   th:classappend="${paginaAtiva == 'relatorioRepasses'} ? ' ativo'">
                                    💸 Repasses
                                </a>

                            </div>

                        </div>

                    </div>
                    <!-- FIM RELATÓRIOS -->

                </nav>

            </aside>

            <!-- JAVASCRIPT -->
            <script>

                function alternarMenu() {

                    const menu = document.querySelector('.menu-lateral');
                    const overlay = document.querySelector('.menu-overlay');

                    menu.classList.toggle('menu-aberto');
                    overlay.classList.toggle('ativo');

                    document.body.classList.toggle('menu-mobile-aberto');
                    document.documentElement.classList.toggle('menu-mobile-aberto');
                }

                function alternarRelatorios() {

                    const submenu = document.querySelector('.submenu-relatorios');

                    if (submenu) {
                        submenu.classList.toggle('aberto');
                    }
                }

            </script>

        </div>

    </body>
</html>
