<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

    <head th:replace="~{fragments/head :: head('Nova Negociação')}"></head>

    <body class="pagina-com-menu">

        <div th:replace="~{fragments/menu :: menu}"></div>

        <div class="container">

            <h1>🤝 Nova Negociação</h1>

            <form th:action="@{/negociacoes/iniciar}"
                  method="post"
                  class="card-form">

                <h2>📋 Dados da Negociação</h2>

                <div class="form-grid">

                    <div class="campo">
                        <label for="clienteId">Comprador</label>

                        <select id="clienteId"
                                name="clienteId"
                                required>

                            <option value="">Selecione...</option>

                            <option th:each="c : ${clientes}"
                                    th:value="${c.id}"
                                    th:text="${c.nome + ' - ' + c.telefone}">
                            </option>

                        </select>
                    </div>

                    <div class="campo">
                        <label for="veiculoId">Veículo</label>

                        <select id="veiculoId"
                                name="veiculoId"
                                required>

                            <option value="">Selecione...</option>

                            <option th:each="v : ${veiculos}"
                                    th:value="${v.id}"
                                    th:text="${v.nome + ' (' + v.ano + ') - ' + v.placa}"
                                    th:data-preco="${v.preco}">
                            </option>

                        </select>
                    </div>

                    <div class="campo">
                        <label for="valorProposto">Valor Proposto</label>

                        <input type="number"
                               id="valorProposto"
                               name="valorProposto"
                               step="0.01"
                               min="0.01"
                               placeholder="Preenchido pelo veículo"
                               required>
                    </div>

                </div>

                <button type="submit" class="btn-salvar">
                    🤝 Iniciar Negociação
                </button>

            </form>

        </div>

        <script>
            const veiculoSelect =
                    document.getElementById("veiculoId");

            const valorProposto =
                    document.getElementById("valorProposto");

            veiculoSelect.addEventListener("change", function () {

                const opcaoSelecionada =
                        veiculoSelect.options[veiculoSelect.selectedIndex];

                const preco =
                        parseFloat(
                            opcaoSelecionada.getAttribute("data-preco")
                        );

                if (!isNaN(preco)) {
                    valorProposto.value = preco.toFixed(2);
                } else {
                    valorProposto.value = "";
                }

            });
        </script>

    </body>
</html>
